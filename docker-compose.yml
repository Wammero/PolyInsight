services:
  db:
    image: postgres:15-alpine
    container_name: polymarket_prometheus_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: whale_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d whale_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: polymarket_prometheus_cache
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redisdata:/data
    

  bot:
    build: .
    container_name: polymarket_prometheus_bot
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "host=db port=5432 user=user password=password dbname=whale_tracker sslmode=disable"
      REDIS_URL: "redis:6379"
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      MIN_WHALE_AMOUNT: ${MIN_WHALE_AMOUNT:-100}
      NEWBIE_THRESHOLD: ${NEWBIE_THRESHOLD:-500}
      MIN_ODDS: ${MIN_ODDS:-1.0}
      BOT_BASE_URL: "${BOT_BASE_URL:-}"
      MINI_APP_URL: "${MINI_APP_URL:-}"

  prometheus:
    image: prom/prometheus:latest
    container_name: poly_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: poly_grafana
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

volumes:
  pgdata:
  promdata:
  grafanadata:
  redisdata: