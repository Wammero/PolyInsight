services:
  db:
    image: postgres:15-alpine
    container_name: polymarket_prometheus_db
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-whale_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme_postgres}"
      POSTGRES_DB: whale_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whale_user} -d whale_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: polymarket_prometheus_cache
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme_redis}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redisdata:/data

  bot:
    build: .
    container_name: polymarket_prometheus_bot
    restart: always
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "host=db port=5432 user=${POSTGRES_USER:-whale_user} password=${POSTGRES_PASSWORD:-changeme_postgres} dbname=whale_tracker sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0"
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      MIN_WHALE_AMOUNT: ${MIN_WHALE_AMOUNT:-100}
      MIN_ODDS: ${MIN_ODDS:-1.0}
      BOT_BASE_URL: "${BOT_BASE_URL:-}"
      MINI_APP_URL: "${MINI_APP_URL:-}"
    ports:
      - "0.0.0.0:2112:2112"

  prometheus:
    image: prom/prometheus:latest
    container_name: poly_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=10y'   # хранить данные 10 лет = практически бесконечно
      - '--storage.tsdb.retention.size=20GB'  # но не больше 20 ГБ на диске
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: poly_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-changeme_grafana}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      POSTGRES_USER: "${POSTGRES_USER:-whale_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme_postgres}"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

volumes:
  pgdata:
  promdata:
  grafanadata:
  redisdata:
